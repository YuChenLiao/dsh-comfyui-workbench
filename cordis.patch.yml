# 把本插件插进 DSH profile 的配置树（bundle 挂载声明）。
#
# 安装（发布态）：
#   dsh plugin --profile desktop add github:YuChenLiao/dsh-comfyui-workbench
# 安装（本地开发）：
#   dsh plugin --profile desktop add link:<本仓库绝对路径>
# 装完重启 DSH；运行中的 dsh 也可在「设置 → 插件」里启用。
#
# 全部字段都可省略。下面的 config 只是把默认值写出来，方便对照修改。
# 优先级：profile 配置 > 环境变量（COMFYUI_URL / COMFYUI_BASE_URL / COMFYUI_TIMEOUT_MS）> 内置默认。
- insert:
    # 九条 entry：包根 core（承载浏览器端 + 共享运行时）+ 八个组件。
    # 宿主「设置 → 插件」里能看到并单独开关。
    # 配置用 YAML 锚点共享 —— 只写一次，改的时候也只改一处。
    # 包根 entry：只为让宿主装配 exports["./client"]（侧栏图标与 better-sidebar 页签）。
    # 宿主按"包根说明符"找浏览器端，子路径 entry 挂不上 client，所以这条不能省。
    - id: comfyui-workbench:core
      name: dsh-comfyui-workbench
      config: &cwf
        # ── 资产库 ──
        # 额外纳入资产库的目录（绝对路径）。默认已包含：当前工作目录、全部 workspace、
        # dsh-comfyui-image 的 outputDir、进程 cwd。
        roots: []
        # 扫描深度，0 = 只看根目录本身。
        maxDepth: 3
        # 单个根目录最多收集多少个文件。
        maxItems: 4000
        # 列表缓存毫秒数；资产库里的刷新会强制重扫。
        cacheMs: 4000
        # 是否进入 .开头的目录。
        includeHidden: false

        # ── ComfyUI ──
        # 服务地址。设置里也有对应的输入框；这里是同一份配置。
        baseUrl: http://127.0.0.1:8188
        # 透传请求头：反代鉴权、Cookie 之类。插件不内置任何默认值。
        headers: {}
        # 产物落盘目录；不写则落到当前 workspace 根。
        outputDir: null
        # 除 outputDir 外还要纳入索引的目录。
        assetRoots: []
        # 工作流模板目录；不写则用 ~/.dsh-comfyui-workbench/workflows。
        workflowsDir: null
        # 上传的参考图目录；不写则用 ~/.dsh-comfyui-workbench/uploads。
        uploadsDir: null
        # 资产索引文件；不写则用 ~/.dsh-comfyui-workbench/assets.jsonl。
        indexFile: null
        # 关掉的组件（默认全开）。八个组件互相独立，某个出问题可以只关它：
        #   panel.workflow     用户面板 · 工作流
        #   panel.gallery      用户面板 · 相册
        #   panel.tags         用户面板 · 标签库（只读浏览 / 搜索 / 复制 tag）
        #   panel.poses        用户面板 · 姿势库（浏览 / 搜索 / 取线稿）+ 姿势工具
        #   panel.terminal     用户面板 · ComfyUI 终端（命令行输出）
        #   tool.generate      模型工具 · 生图（含列出/查看工作流）
        #   tool.workflow-edit 模型工具 · 工作流编辑
        #   tool.danbooru      模型工具 · Danbooru 标签查询与同步
        disabledComponents: []

        # ── 服务托管 ──
        # 自动探测 ComfyUI 安装位置（判据：有 main.py 且有 models 目录）。
        autoDetect: true
        # 未运行时按需拉起。拉起期间到达的请求会排队等待，不会立刻失败。
        autoStart: true
        # 特殊情况才填完整启动命令。注意这种模式下不会自动设 cwd，main.py 要给绝对路径或先自行 cd，
        # 例如 ["D:/ComfyUI/venv/Scripts/python.exe", "D:/ComfyUI/main.py", "--port", "8188"]（正斜杠省掉 YAML 转义）。
        startCommand: []
        # 冷启就绪上限（ComfyUI 比模型服务慢）。
        readyTimeoutMs: 180000
        # 空闲多久后停止「自己拉起的」进程；0 = 不回收。外部实例永不被停。
        idleShutdownMs: 300000

        # ── 运行 ──
        # 未绑定变量是否报错（默认报错；关掉则静默保留 {{var}} 原样）。
        strictVars: true
        # 点生成时走哪条路：conversation（发进对话，由模型执行）| direct（UI 直连）。
        runMode: conversation
        # 工具响应带回几张图：first | all（上限 3）| none。
        returnImages: first
        # 单次运行等待上限。
        timeoutMs: 300000
        # 轮询 /history 的间隔。
        pollIntervalMs: 1000

        # ── 其它 ──
        # 索引模式：auto（JSONL 索引）| off（只用扫描）。
        indexMode: auto
        # better-sidebar 页签：auto | on | off。
        betterSidebarTab: auto
        # 用 /ws 读精确进度。开了之后面板提交（/run、/rerun）的记录会带
        # progress:{value,max}；订阅复用提交时的 client_id，所以要求 /ws 可达
        # （反代/鉴权层挡住就算降级，出图不受影响）。工具提交的没有进度。
        # 这里只是**默认值** —— 「工作流管理」面板上可以直接开关，不用改这个文件也不用重启。
        # 也可用环境变量 COMFYUI_PROGRESS_WS=1 打开。
        progressStream: true

        # ── 姿势库 ──
        # 姿势线稿的图床根地址，**必须 https**（否则回退默认）。图不随包分发，
        # 运行时经服务端代理按需读取并落盘到 <插件数据目录>/cache/poses。
        # 只该改域名，不要指到自己的机器 —— 这就是一个受白名单约束的取图出口。
        posesOrigin: https://ai-pose-gallery.anhao.app
    - id: comfyui-workbench:gallery
      name: dsh-comfyui-workbench/gallery
      config: *cwf
    - id: comfyui-workbench:workflow
      name: dsh-comfyui-workbench/workflow
      config: *cwf
    - id: comfyui-workbench:tags
      name: dsh-comfyui-workbench/tags
      config: *cwf
    - id: comfyui-workbench:poses
      name: dsh-comfyui-workbench/poses
      config: *cwf
    - id: comfyui-workbench:generate
      name: dsh-comfyui-workbench/generate
      config: *cwf
    - id: comfyui-workbench:edit
      name: dsh-comfyui-workbench/edit
      config: *cwf
    - id: comfyui-workbench:danbooru
      name: dsh-comfyui-workbench/danbooru
      config: *cwf
    - id: comfyui-workbench:terminal
      name: dsh-comfyui-workbench/terminal
      config: *cwf
